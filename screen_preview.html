<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Haval Climate Control — Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── design tokens ── */
:root {
  --bg:          #000000;
  --surface:     #141414;
  --surface-2:   #1c1c1c;
  --border:      rgba(255,255,255,0.07);
  --border-strong: rgba(255,255,255,0.12);
  --fg:          #fafafa;
  --fg-muted:    #a3a3a3;
  --fg-dim:      #6b6b6b;
  --fg-faint:    #404040;
  --accent:      #22c55e;
  --accent-soft: rgba(34,197,94,0.12);
  --accent-edge: rgba(34,197,94,0.40);
  --warn:        #f5b14b;
  --radius-sm:   10px;
  --radius:      16px;
  --radius-lg:   22px;
  --font:        "Geist","Inter",system-ui,-apple-system,sans-serif;
  --mono:        "Geist Mono","JetBrains Mono",ui-monospace,monospace;
}

/* ── reset / stage ── */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #000; color: var(--fg);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.stage-wrap {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: #000; overflow: hidden;
}
.stage {
  width: 1792px; height: 660px;
  background: var(--bg);
  transform-origin: center center;
  overflow: hidden;
  outline: 1px solid rgba(255,255,255,0.04);
}
.stage > #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
.stage > #root > * { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ── theme variants ── */
.stage[data-theme="pure-black"]  { --bg: #000000; --surface: #0e0e0e; --surface-2: #161616; }
.stage[data-theme="dark-gray"]   { --bg: #0a0a0a; --surface: #161616; --surface-2: #1e1e1e; }
.stage[data-theme="near-black"]  { --bg: #141414; --surface: #1c1c1c; --surface-2: #242424; }

/* ── app shell ── */
.app {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding: 24px 32px; gap: 20px;
}

/* ── header ── */
.app-header {
  display: flex; align-items: center;
  justify-content: space-between;
  height: 36px; flex-shrink: 0;
}
.brand {
  display: flex; align-items: center; gap: 12px;
  letter-spacing: 0.16em; font-size: 17px; font-weight: 600;
  color: var(--fg-muted); text-transform: uppercase;
}
.brand-mark {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--border-strong);
  display: grid; place-items: center;
  color: var(--fg); font-weight: 700; font-size: 15px; letter-spacing: 0;
}
.brand .sep { color: var(--fg-faint); }

.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  appearance: none; background: none; border: 0; font: inherit;
  color: var(--fg-dim); padding: 8px 16px; border-radius: 999px;
  font-size: 17px; font-weight: 500; letter-spacing: 0.02em;
  cursor: pointer; transition: all 0.15s ease;
  display: flex; align-items: center; gap: 6px;
}
.nav-tab:hover { color: var(--fg); background: var(--surface); }
.nav-tab.active {
  color: var(--fg); background: var(--surface-2);
  border: 1px solid var(--border-strong); padding: 7px 15px;
}
.nav-tab .tab-num { color: var(--fg-faint); font-variant-numeric: tabular-nums; font-size: 14px; }
.nav-tab.active .tab-num { color: var(--fg-muted); }

.status-cluster { display: flex; align-items: center; gap: 16px; }
.status-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px 6px 10px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface);
  font-size: 16px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-muted);
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
.dot.idle { background: var(--fg-dim); box-shadow: none; }

/* ── main grid ── */
.main-grid {
  flex: 1; display: grid;
  grid-template-rows: 1fr auto;
  gap: 16px; min-height: 0;
}
.hero-3col {
  display: grid;
  grid-template-columns: 380px 1fr 380px;
  gap: 18px; min-height: 0;
}

/* ── AUTO master card (left) ── */
.auto-card {
  display: flex; flex-direction: column;
  justify-content: space-between;
  padding: 24px 26px; border-radius: var(--radius-lg);
  background: linear-gradient(180deg, var(--surface) 0%, #0a0a0a 100%);
  border: 1px solid var(--border-strong);
  cursor: pointer; transition: all 0.2s ease;
  position: relative; overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 0 rgba(0,0,0,0.6);
}
.auto-card.on {
  background: linear-gradient(180deg, rgba(34,197,94,0.10) 0%, rgba(34,197,94,0.02) 100%);
  border-color: var(--accent-edge);
  box-shadow: inset 0 1px 0 rgba(34,197,94,0.18), 0 1px 0 rgba(0,0,0,0.6), 0 0 32px rgba(34,197,94,0.06);
}
.auto-card-head { display: flex; align-items: center; justify-content: space-between; }
.auto-card-eyebrow {
  font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fg-dim); font-weight: 600;
}
.auto-card-led {
  display: flex; align-items: center; gap: 8px;
  font: 600 15px var(--mono); letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--fg-dim);
}
.auto-card-led .ld {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--fg-faint);
  box-shadow: inset 0 1px 1px rgba(0,0,0,0.6);
}
.auto-card.on .auto-card-led { color: var(--accent); }
.auto-card.on .auto-card-led .ld {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent), 0 0 14px rgba(34,197,94,0.4);
}
.auto-card-body { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.auto-card-icon-row { display: flex; align-items: center; gap: 16px; }
.auto-card-icon {
  width: 56px; height: 56px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; color: var(--fg-muted); flex: 0 0 auto;
}
.auto-card.on .auto-card-icon {
  color: var(--accent);
  background: rgba(34,197,94,0.08); border-color: var(--accent-edge);
}
.auto-card-title {
  font-size: 28px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--fg); line-height: 1.05;
}
.auto-card-state { font-size: 17px; color: var(--fg-muted); margin-top: 4px; }
.auto-card.on .auto-card-state { color: var(--accent); }
.auto-toggle {
  margin-top: 20px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-radius: 14px;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  font-size: 17px; color: var(--fg-muted); letter-spacing: 0.04em;
}
.auto-card.on .auto-toggle {
  background: rgba(34,197,94,0.08);
  border-color: var(--accent-edge); color: var(--fg);
}
.toggle-switch-mini {
  width: 54px; height: 30px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border-strong);
  position: relative; flex-shrink: 0; transition: all 0.2s ease;
}
.toggle-switch-mini::after {
  content: ""; position: absolute;
  top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--fg-muted);
  transition: all 0.2s cubic-bezier(.4,0,.2,1);
}
.auto-card.on .toggle-switch-mini { background: var(--accent); border-color: var(--accent); }
.auto-card.on .toggle-switch-mini::after { left: 27px; background: #fff; }

/* ── center hero ── */
.hero-center {
  position: relative;
  background: radial-gradient(ellipse at center top, rgba(255,255,255,0.025), transparent 60%), var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 14px 18px 8px;
  display: grid; grid-template-rows: auto 1fr auto;
  gap: 6px; min-height: 0; overflow: hidden;
}
.hero-center-top {
  display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
}
.hero-center-eyebrow {
  font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--fg-dim); font-weight: 600;
}
.hero-setpoint { display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
.hero-setpoint .lab {
  font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--fg-dim); margin-right: 8px; font-weight: 600;
}
.hero-setpoint .v {
  font-size: 36px; font-weight: 500;
  letter-spacing: -0.03em; color: var(--fg); line-height: 1;
}
.hero-setpoint .u { font-size: 19px; color: var(--fg-muted); }
.car-viz { position: relative; display: grid; place-items: center; min-height: 0; }
.car-viz svg { width: 100%; height: 100%; max-height: 320px; }
.hero-center-bottom {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 0 6px 4px;
}
.hero-pill {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: 999px; font: 500 16px var(--mono);
  color: var(--fg-muted); letter-spacing: 0.06em; text-transform: uppercase;
}
.hero-pill .ldot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 6px var(--accent);
}
.hero-pill.idle .ldot { background: var(--fg-faint); box-shadow: none; }

/* airflow */
@keyframes flowL {
  0%   { stroke-dashoffset: 0;   opacity: 0; }
  30%  { opacity: 0.55; }
  100% { stroke-dashoffset: -60; opacity: 0; }
}
@keyframes flowR {
  0%   { stroke-dashoffset: 0;  opacity: 0; }
  30%  { opacity: 0.55; }
  100% { stroke-dashoffset: 60; opacity: 0; }
}
.flow-l path { animation: flowL 2.6s linear infinite; }
.flow-r path { animation: flowR 2.6s linear infinite; }
.flow path:nth-child(2) { animation-delay: 0.6s; }
.flow path:nth-child(3) { animation-delay: 1.2s; }
.flow path:nth-child(4) { animation-delay: 1.8s; }

/* ── right temp cards ── */
.hero-right { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; min-height: 0; }
.temp-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 22px 26px;
  display: flex; flex-direction: column;
  justify-content: space-between; gap: 8px;
}
.temp-card-head { display: flex; justify-content: space-between; align-items: center; }
.temp-card-label {
  font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg-dim); font-weight: 600;
}
.temp-card-icon { color: var(--fg-faint); display: grid; place-items: center; }
.temp-card-value {
  font-size: 64px; font-weight: 500;
  letter-spacing: -0.04em; line-height: 1; color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.temp-card-value .unit { font-size: 24px; color: var(--fg-muted); margin-left: 4px; font-weight: 400; }
.temp-card-foot {
  display: flex; justify-content: space-between; align-items: center;
  font: 500 16px var(--mono); color: var(--fg-dim); letter-spacing: 0.04em;
}
.temp-card-foot .delta {
  padding: 3px 8px; border: 1px solid var(--border-strong); border-radius: 999px;
  color: var(--fg-muted); font-variant-numeric: tabular-nums;
}

/* ── bottom info strip ── */
.info-strip {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 14px; flex: 0 0 auto;
}
.ro-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
  display: grid; grid-template-columns: 44px 1fr;
  align-items: center; gap: 14px; min-height: 86px;
}
.ro-card-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; color: var(--fg-muted);
}
.ro-card.on .ro-card-icon {
  color: var(--accent);
  background: rgba(34,197,94,0.08); border-color: var(--accent-edge);
}
.ro-card-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ro-card-label {
  font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--fg-dim); font-weight: 600;
}
.ro-card-value {
  font-size: 22px; font-weight: 500; letter-spacing: -0.01em;
  color: var(--fg); display: flex; align-items: center; gap: 8px;
}
.v-led {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 6px var(--accent);
}
.v-led.off { background: var(--fg-faint); box-shadow: none; }
.ro-seg-row { display: flex; gap: 4px; margin-top: 2px; }
.ro-seg {
  flex: 1; padding: 5px 0; text-align: center; border-radius: 6px;
  font: 600 14px var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg-faint); background: var(--surface-2); border: 1px solid var(--border);
}
.ro-seg.on {
  color: var(--accent); background: rgba(34,197,94,0.08); border-color: var(--accent-edge);
}
.ro-bars { display: flex; gap: 3px; margin-top: 4px; height: 6px; }
.ro-bar { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 1px; }
.ro-bar.on { background: var(--fg); border-color: var(--fg); }

/* ── sub-screen header ── */
.app-header { display: flex; align-items: center; justify-content: space-between; height: 36px; flex-shrink: 0; }
.back-btn {
  appearance: none; background: var(--surface); border: 1px solid var(--border-strong);
  color: var(--fg); width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; cursor: pointer; font: inherit;
  transition: all 0.15s ease;
}
.back-btn:hover { background: var(--surface-2); border-color: var(--fg-faint); }
.sub-title-block { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.sub-eyebrow { font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-dim); }
.sub-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }

/* ── debug screens ── */
.debug-grid {
  flex: 1; display: grid;
  grid-template-columns: 1fr 1fr 460px;
  gap: 16px; min-height: 0;
}
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0;
}
.panel-head {
  padding: 14px 18px 12px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.panel-title { font-size: 17px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); }
.panel-meta { font-size: 16px; color: var(--fg-dim); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.panel-body { flex: 1; overflow: hidden; padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }

.prop-row {
  display: grid; grid-template-columns: 16px 1fr auto;
  align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
}
.prop-row:hover { background: rgba(255,255,255,0.02); }
.prop-icon { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-faint); margin-left: 5px; }
.prop-row.read-only .prop-icon { background: transparent; border: 1px solid var(--fg-faint); }
.prop-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.prop-name { font-size: 17px; color: var(--fg); font-weight: 500; }
.prop-id { font-size: 15px; color: var(--fg-dim); font-family: var(--mono); letter-spacing: 0.02em; }
.prop-actions { display: flex; gap: 4px; }
.prop-btn {
  appearance: none; background: var(--surface-2); border: 1px solid var(--border);
  color: var(--fg-muted); font: 500 14px var(--mono); padding: 6px 10px;
  border-radius: 7px; cursor: pointer; transition: all 0.12s ease;
  letter-spacing: 0.02em; min-width: 38px; font-variant-numeric: tabular-nums;
}
.prop-btn:hover { color: var(--fg); border-color: var(--fg-faint); }
.prop-btn.active { background: var(--fg); color: #000; border-color: var(--fg); }
.prop-readonly-val {
  font: 500 15px var(--mono); color: var(--fg-muted);
  padding: 4px 10px; background: rgba(255,255,255,0.03);
  border-radius: 6px; font-variant-numeric: tabular-nums;
  border: 1px solid var(--border);
}

/* ── log ── */
.log {
  font-family: var(--mono); font-size: 14px; line-height: 1.55;
  padding: 10px 14px; flex: 1; overflow: hidden;
  display: flex; flex-direction: column-reverse; gap: 1px;
}
.log-line { display: grid; grid-template-columns: 64px 60px 1fr; gap: 10px; padding: 2px 0; }
.log-time { color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.log-tag { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; color: var(--fg-muted); }
.log-tag.write { color: var(--accent); }
.log-tag.read  { color: #6dafff; }
.log-tag.warn  { color: var(--warn); }
.log-tag.info  { color: var(--fg-muted); }
.log-msg { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-msg .v { color: var(--fg-muted); }
.log-msg .k { color: var(--fg-dim); }

/* ── seat vent cards ── */
.vent-cards { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
.vent-card {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px;
  display: flex; flex-direction: column; gap: 10px;
}
.vent-card-head { display: flex; justify-content: space-between; align-items: baseline; }
.vent-card-title { font-size: 16px; font-weight: 500; color: var(--fg); }
.vent-card-tag { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); }
.vent-card-body { display: flex; align-items: baseline; gap: 8px; }
.vent-level { font-size: 38px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.vent-of { color: var(--fg-dim); font-size: 17px; }
.vent-bars { display: flex; gap: 4px; height: 8px; margin-top: 6px; }
.vent-bar { flex: 1; background: var(--surface); border-radius: 2px; border: 1px solid var(--border); }
.vent-bar.on { background: var(--fg); border-color: var(--fg); }

/* ── display info screen ── */
.display-grid {
  flex: 1; display: grid;
  grid-template-columns: 1fr 720px;
  gap: 16px; min-height: 0;
}
.display-stats {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 16px;
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0 32px; align-content: start;
}
.dstat-row {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; padding: 14px 0;
  border-bottom: 1px solid var(--border); gap: 16px;
}
.dstat-row.no-border { border-bottom: 0; }
.dstat-label { font-size: 16px; color: var(--fg-muted); }
.dstat-label .hint { color: var(--fg-dim); font-size: 14px; margin-left: 8px; }
.dstat-val { font: 500 16px var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.dstat-val .unit { color: var(--fg-dim); margin-left: 4px; font-weight: 400; }
.display-viz {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px;
  display: flex; flex-direction: column; gap: 16px; min-height: 0;
}
.viz-title { font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); font-weight: 600; }
.viz-frame {
  flex: 1; background: #0a0a0a; border: 1px solid var(--border);
  border-radius: 12px; position: relative; display: grid; place-items: center; overflow: hidden;
}
.viz-area {
  border: 1px dashed var(--fg-faint); width: 78%; height: 70%;
  border-radius: 6px; position: relative; display: grid; place-items: center;
}
.viz-label {
  font: 500 13px var(--mono); color: var(--fg-muted);
  background: var(--surface-2); padding: 6px 10px;
  border-radius: 6px; font-variant-numeric: tabular-nums;
}
.viz-tick {
  position: absolute; font: 500 10px var(--mono);
  color: var(--fg-dim); letter-spacing: 0.04em; font-variant-numeric: tabular-nums;
}

/* ── tweaks panel ── */
.twk-panel {
  position: fixed; right: 16px; bottom: 16px; z-index: 9999; width: 260px;
  background: rgba(250,249,247,0.85); color: #29261b;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border: 0.5px solid rgba(255,255,255,0.6); border-radius: 14px;

        {p.kind === "toggle" ? (
          <>
            <button className={"prop-btn" + (p.value === 0 ? " active" : "")} onClick={() => onChange(p.id, 0)}>0</button>
            <button className={"prop-btn" + (p.value === 1 ? " active" : "")} onClick={() => onChange(p.id, 1)}>1</button>
          </>
        ) : p.options.map((opt, i) => (
          <button key={i}
            className={"prop-btn" + (p.value === (isNaN(+opt) ? i : +opt) ? " active" : "")}
            onClick={() => onChange(p.id, isNaN(+opt) ? i : +opt)}>
            {opt}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── tweaks panel ─────────────────────────────────────────────
function TweaksPanel({ theme, setTheme }) {
  const [open, setOpen] = useState(true);
  const ref = useRef(null);
  const off = useRef({ x:16, y:16 });

  const clamp = useCallback(() => {
    const p = ref.current; if (!p) return;
    const maxX = Math.max(16, window.innerWidth - p.offsetWidth - 16);
    const maxY = Math.max(16, window.innerHeight - p.offsetHeight - 16);
    off.current = { x: Math.min(maxX, Math.max(16, off.current.x)), y: Math.min(maxY, Math.max(16, off.current.y)) };
    p.style.right = off.current.x + "px";
    p.style.bottom = off.current.y + "px";
  }, []);

  const onDrag = (e) => {
    const p = ref.current; if (!p) return;
    const r = p.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const move = ev => { off.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; clamp(); };
    const up = () => { window.removeEventListener("mousemove",move); window.removeEventListener("mouseup",up); };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  };

  const opts = [
    { v:"pure-black", l:"Puro" },
    { v:"dark-gray",  l:"Escuro" },
    { v:"near-black", l:"Quase preto" },
  ];
  const idx = opts.findIndex(o => o.v === theme);

  if (!open) return null;
  return (
    <div ref={ref} className="twk-panel" style={{ right:16, bottom:16 }}>
      <div className="twk-hd" onMouseDown={onDrag}>
        <b>Tweaks</b>
        <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
      </div>
      <div className="twk-body">
        <div className="twk-sect">Tema</div>
        <div className="twk-lbl">Background</div>
        <div className="twk-seg" style={{ position:"relative" }}>
          <div className="twk-seg-thumb" style={{
            left: `calc(2px + ${idx} * (100% - 4px) / 3)`,
            width: "calc((100% - 4px) / 3)"
          }}/>
          {opts.map(o => (
            <button key={o.v} type="button" onClick={() => setTheme(o.v)}
                    style={{ flex:1, appearance:"none", border:0, background:"transparent", cursor:"pointer",
                             position:"relative", zIndex:1, padding:"4px 6px", fontWeight:500 }}>
              {o.l}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── app root ─────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("main");
  const [theme,  setTheme]  = useState("pure-black");
  const [state,  setState]  = useState({
    autoOn: true, comfortMode: "AUTO",
    setpoint: 24.0, cabinTemp: 27.3, outsideTemp: 31.0,
    acOn: true, ventL: 2, ventR: 2,
  });

  useEffect(() => {
    const stage = document.querySelector(".stage");
    if (stage) stage.setAttribute("data-theme", theme);
  }, [theme]);

  useEffect(() => {
    const fit = () => {
      const s = document.querySelector(".stage");
      if (!s) return;
      const sc = Math.min(window.innerWidth / 1792, window.innerHeight / 660);
      s.style.transform = `scale(${sc})`;
    };
    fit();
    window.addEventListener("resize", fit);
    return () => window.removeEventListener("resize", fit);
  }, []);

  const onNav = s => setScreen(s);

  let body;
  if      (screen === "main")    body = <MainScreen    state={state} setState={setState} onNav={onNav}/>;
  else if (screen === "hvac")    body = <HvacScreen    onNav={onNav}/>;
  else if (screen === "seat")    body = <SeatScreen    onNav={onNav} ventL={state.ventL} ventR={state.ventR}/>;
  else if (screen === "display") body = <DisplayScreen onNav={onNav}/>;

  return <>
    <div>{body}</div>
    <TweaksPanel theme={theme} setTheme={setTheme}/>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
